; PHP Configuration for Docker - Performance Optimizations

; OPcache Configuration (Development mode - validates file changes)
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=1
opcache.revalidate_freq=2
opcache.fast_shutdown=1

; Memory and execution limits
memory_limit=512M
max_execution_time=300
max_input_time=300

; File upload limits
upload_max_filesize=50M
post_max_size=50M

; Realpath cache (improves file system performance)
realpath_cache_size=4096K
realpath_cache_ttl=600

; Error reporting (disable in production for performance)
display_errors=Off
display_startup_errors=Off
log_errors=On

; Session configuration
session.gc_maxlifetime=1440
