# Custom log format with timing information
log_format detailed '$remote_addr - $remote_user [$time_local] '
                   '"$request" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent" '
                   'rt=$request_time uct="$upstream_connect_time" '
                   'uht="$upstream_header_time" urt="$upstream_response_time"';

server {
    listen 80;
    server_name _;
    index index.php index.html;
    # Logs go to stdout/stderr for Docker (faster than file I/O in WSL)
    error_log  /dev/stderr warn;
    access_log /dev/stdout detailed;
    root /var/www/html/public;

    # Maximum upload size (for PDF files)
    client_max_body_size 50M;

    # Disable server tokens for security and performance
    server_tokens off;

    # Sendfile optimization
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Keepalive connections
    keepalive_timeout 65;
    keepalive_requests 100;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # S3 storage route - MUST be before static files and use prefix match for priority
    location ^~ /storage/s3/ {
        # Pass directly to PHP without trying to find the file
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param QUERY_STRING $query_string;
    }

    # Cache static files - must match before location /
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Handle PHP files
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # FastCGI timeouts - critical for performance
        fastcgi_connect_timeout 2s;
        fastcgi_send_timeout 30s;
        fastcgi_read_timeout 30s;

        # FastCGI buffers - optimize for better performance
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;

        # Enable buffering for better performance (was causing issues when off)
        fastcgi_buffering on;

        # Keep connections alive
        fastcgi_keep_conn on;

        # FastCGI cache key
        fastcgi_cache_key "$scheme$request_method$host$request_uri";
    }

    # All other requests go to Laravel - this is the catch-all
    location / {
        proxy_set_header X-Forwarded-Proto $scheme;
        try_files $uri $uri/ /index.php?$query_string;
    }
}
