services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
            target: laravel-app
        container_name: ailitreview_app
        restart: unless-stopped
        working_dir: /var/www/html
        volumes:
            # Use delegated for better write performance in WSL (cached is slow for file operations)
            - ./:/var/www/html:delegated
            - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
        environment:
            - PHP_OPCACHE_VALIDATE_TIMESTAMPS=1
            # Sobrepõe o APP_KEY placeholder definido no Dockerfile (ENV) pelo do .env
            - APP_KEY=${APP_KEY}
        extra_hosts:
            - "host.docker.internal:host-gateway"
        networks:
            - ailitreview-network
        depends_on:
            - db

    ollama:
        image: ollama/ollama:latest
        container_name: ailitreview_ollama
        restart: unless-stopped
        volumes:
            - ollama_data:/root/.ollama
        environment:
            # As requisições do app não enviam num_ctx; sem isso PDFs completos (~30k tokens) são truncados
            - OLLAMA_CONTEXT_LENGTH=32768
        # Requer nvidia-container-toolkit no host
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: all
                          capabilities: [gpu]
        networks:
            - ailitreview-network

    queue:
        build:
            context: .
            dockerfile: Dockerfile
            target: laravel-app
        #    container_name: ailitreview_queue
        restart: unless-stopped
        working_dir: /var/www/html
        volumes:
            - ./:/var/www/html:delegated
            - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
        extra_hosts:
            - "host.docker.internal:host-gateway"
        environment:
            - APP_KEY=${APP_KEY}
        # O entrypoint roda como root (cria pastas e corrige o dono de storage/); o worker roda
        # como www-data, o mesmo usuário do PHP-FPM, para que os arquivos que ele grava (como os
        # .md dos estudos e as views compiladas) possam ser alterados pelo site
        command: ["setpriv", "--reuid=www-data", "--regid=www-data", "--init-groups", "php", "artisan", "queue:work", "--tries=3", "--timeout=600"]
        networks:
            - ailitreview-network
        depends_on:
            - app
            - db

    nginx:
        image: nginx:alpine
        container_name: ailitreview_nginx
        restart: unless-stopped
        ports:
            - "8081:80"
        volumes:
            # Use delegated for better performance in WSL
            - ./:/var/www/html:delegated
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        networks:
            - ailitreview-network
        depends_on:
            - app

    db:
        image: mysql:8.0
        container_name: ailitreview_db
        restart: unless-stopped
        ports:
            - "3308:3306"
        environment:
            MYSQL_DATABASE: ailitreview_db
            MYSQL_ROOT_PASSWORD: root
            MYSQL_PASSWORD: root
            MYSQL_USER: ailitreview_user
            SERVICE_TAGS: dev
            SERVICE_NAME: mysql
        volumes:
            - db_data:/var/lib/mysql
        networks:
            - ailitreview-network

networks:
    ailitreview-network:
        driver: bridge

volumes:
    db_data:
        driver: local
    ollama_data:
        driver: local
